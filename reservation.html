<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver – Safar Voyages</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Safar Voyages</h1>
        <p>Agence de voyages tunisienne</p>
        <img src="images/istockphoto-2220609311-612x612.jpg" loading="lazy" alt="Plage avec un palmier et la mer" width="800" height="300">
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="destinations.html">Destinations</a></li>
            <li><a href="tarifs.html">Tarifs</a></li>
            <li><a href="reservation.html">Réserver</a></li>
        </ul>
    </nav>
    <main>
        <h2>Réserver un voyage</h2>
        <p id="succes" hidden></p>
        <form id="reservation" novalidate onsubmit="return verifierFormulaire()">
            <fieldset>
                <legend>Vos coordonnées</legend>
                <p>
                    <label for="nom">Nom :</label><br>
                    <input type="text" id="nom" name="nom">
                    <span id="erreur-nom" class="erreur"></span>
                </p>
                <p>
                    <label for="prenom">Prénom :</label><br>
                    <input type="text" id="prenom" name="prenom">
                    <span id="erreur-prenom" class="erreur"></span>
                </p>
                <p>
                    <label for="email">E-mail :</label><br>
                    <input type="email" id="email" name="email" placeholder="vous@exemple.tn">
                    <span id="erreur-email" class="erreur"></span>
                </p>
                <p>
                    <label for="telephone">Téléphone (8 chiffres) :</label><br>
                    <input type="tel" id="telephone" name="telephone" placeholder="29512816">
                    <span id="erreur-telephone" class="erreur"></span>
                </p>
            </fieldset>

            <fieldset>
                <legend>Votre voyage</legend>
                <p>
                    <label for="destination">Destination :</label><br>
                    <select id="destination" name="destination">
                        <option value="">-- Choisir --</option>
                        <option value="djerba">Djerba</option>
                        <option value="tabarka">Tabarka</option>
                        <option value="istanbul">Istanbul</option>
                        <option value="paris">Paris</option>
                        <option value="rome">Rome</option>
                        <option value="caire">Le Caire</option>
                    </select>
                    <span id="erreur-destination" class="erreur"></span>
                </p>
                <p>
                    <label for="date">Date de départ :</label><br>
                    <input type="date" id="date" name="date">
                    <span id="erreur-date" class="erreur"></span>
                </p>
                <p>
                    <label for="nb">Nombre de voyageurs (1 à 10) :</label><br>
                    <input type="number" id="nb" name="nb" value="1">
                    <span id="erreur-nb" class="erreur"></span>
                </p>
                <p>
                    <label for="message">Précisions :</label><br>
                    <textarea id="message" name="message" rows="4" cols="40"></textarea>
                </p>
            </fieldset>

            <p>
                <button type="submit">Envoyer</button>
                <button type="reset">Effacer</button>
            </p>
        </form>
    </main>
    <footer>
        <div>
            <h3>Contact</h3>
            <p>Safar Voyages – Sfax</p>
            <p>Tél : +216 74 000 000</p>
            <p><a href="mailto:contact@safarvoyages.tn">contact@safarvoyages.tn</a></p>
        </div>
        <div>
            <h3>Horaires</h3>
            <p>Lundi – Vendredi : 9h – 18h</p>
            <p>Samedi : 9h – 13h</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
